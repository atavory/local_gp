[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpo-aware-aggregation"
version = "0.1.0"
description = "Probe-scored optimizer-arm aggregation utilities for PyTorch"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools.packages.find]
include = ["hpo_aware_aggregation*"]
